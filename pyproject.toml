[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = 'NicolaCanepa_Tools'
version = "0.1.4"
description = "Useful tools"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    'attrs',
    'click',
    'click-loglevel',
    'dnspython',
    'eyed3',
    'netifaces-plus',
    'ping3',
    'questionary',
    'requests',
    'rich',
    'typer',
    'typing;python_version<"3.7"',
    'ConfigArgParse',
]
authors = [
    {name = 'Nicola Canepa', email = 'canne74@gmail.com'},
]
    # packages=setuptools.find_packages('src', exclude=['.tox', 'test']),
    # package_dir={"": "src"},
    # data_files=data_files,
classifiers = [
    'Programming Language :: Python :: 3',
    'Operating System :: OS Independent',
]
license = "MIT"

[project.optional-dependencies]
ldap = [ "python-ldap" ]
mac = [ "rumps" ]
media = [ "Pillow" ]
all = [ "python-ldap", "rumps", "Pillow" ]

[project.scripts]
"all.py" = "tools.bin.all:main"
arp-map = "tools.bin.arp_map:main"
"cloudflare_dns.py" = "tools.bin.cloudflare_dns:main"
compare-ka = "tools.bin.compare_ka:main"
config_e2g = "tools.bin.config_proxy:main"  # compat
config_proxy = "tools.bin.config_proxy:main"
"freedns.py" = "tools.bin.freedns:main"
html-series = "tools.bin.html_series:main"
id3-checker = "tools.bin.id3checker:main"
inky-images = "tools.bin.inky_images:app"
ka-status = "tools.bin.keepalived_status:main"
ldap_browse = "tools.bin.ldap_browser:main [ldap]"
net-watch = "tools.bin.net_watch:main [mac]"
openvpn-log = "tools.bin.openvpn_log:main"
prenotami-auto = "tools.bin.prenotami_auto:main"
qsm = "tools.bin.quick_service_map:main"
"remote_diff.py" = "tools.bin.remote_diff:main"
"sdiff.py" = "tools.bin.sdiff:main"
sservice = "tools.bin.service:main"
service-map = "tools.bin.simple_service_map:main"
ssh-cert-manager = "tools.bin.ssh_cert_manager:app"
slapd_log = "tools.bin.slapd_log:main"
"ssync.py" = "tools.bin.ssync:main"
tags-report = "tools.bin.music_tags_report:main"
total_block = "tools.bin.total_block:main"
vpn-manager = "tools.bin.vpn_manager:app"
xymon-speedtest = "tools.bin.xymon_speedtest:main"
xymon-ip-check = "tools.bin.xymon_ip_check:main"

[tool.black]
# target-version = ['py3']
skip-string-normalization = true
line-length = 120
exclude = '''
(
    \.eggs         # exclude a few common directories in the
  | \.git          # root of the project
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | test/bats
)
'''

[tool.setuptools]
packages = {find = {where = ["src"], exclude = [".tox", "test"]}}

[dependency-groups]
dev = [
    "tox>=4.28.4",
    "pytest",
]

[tool.pytest.ini_options]
addopts = [
    "--verbose",
    "--doctest-modules",
    "--cov=tools",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--ignore=test/bats",
    "--black",
    "--mypy",
    # Uncomment to enforce a minimum code coverage threshold.
    # "--cov-fail-under=50"
]
testpaths = ["test"]
# collect_ignore_glob = "test/bats/**"

[tool.coverage.run]
branch = true
parallel = true
omit = [
    "test/",
    ".tox/"
]

[tool.flake8]
max-complexity = 16
max-line-length = 120
extend-exclude = "test/bats"

[tool.mypy]
ignore_missing_imports = true
show_column_numbers = true
show_error_context = false
strict_optional = false
follow_imports = "skip"
exclude = "test/bats/"

